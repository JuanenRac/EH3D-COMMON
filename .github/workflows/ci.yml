name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks every repository of the suite runs, held once in EH3D-DOCS as a reusable workflow; the reference is a full
  # commit, so a change there reaches this repository only when this line is moved.
  validate:
    uses: JuanenRac/EH3D-DOCS/.github/workflows/validate.yml@b585ca2866e28b53d4ad12e011fbbc2a044804f8
    with:
      python-version: "3.12"
      check-pictures: true
      run-tool-tests: false

  changelog:
    name: The change has a line in the CHANGELOG
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The change has a line in the CHANGELOG
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -I tools/changelog_pr_check.py --base "origin/$BASE_REF"

  firmware-base:
    name: Firmware base copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Projects that keep a copy of the firmware base
        run: |
          for project in EH3D-NODE-BUNGARD EH3D-NODE-BUNGARD-AUX EH3D-NODE-BUNGARD-HMI EH3D-NODE-HMI-GUI; do
            git clone --depth 1 "https://github.com/JuanenRac/${project}.git" "../${project}"
          done
      - name: Firmware base copies
        run: python -I tools/sync_firmware_base.py check --strict

  firmware-host-tests:
    name: Host tests of the firmware base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the tests of the shared headers need no board and no other header than the ones of firmware_base/core: they are compiled with the warnings on and run
      - name: Compile and run the tests that need no board
        run: |
          set -eu
          for test in test_base test_shared; do
            g++ -std=c++17 -Wall -Wextra -O1 -Ifirmware_base/tests/stub -o "/tmp/$test" "firmware_base/tests/$test.cpp"
            "/tmp/$test"
          done
