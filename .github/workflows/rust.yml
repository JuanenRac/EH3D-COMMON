name: EH3D Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: EH3D-COMMON
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo ci-lint
      - name: Tests
        run: cargo ci-test

  consumers-list:
    name: Repositories that depend on this one
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.find.outputs.repos }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Find the repositories whose manifest names this one in depends_on
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          owner, me = os.environ["GITHUB_REPOSITORY"].split("/")


          def get(url, token=None):
              headers = {"Authorization": f"Bearer {token}"} if token else {}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise


          names, page = [], 1
          while True:
              batch = json.loads(get(f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}", os.environ["GITHUB_TOKEN"]))
              if not batch:
                  break
              names += [repo["name"] for repo in batch]
              page += 1
          found = []
          for name in sorted(names):
              if not name.startswith("EH3D-") or name == me:
                  continue
              raw = get(f"https://raw.githubusercontent.com/{owner}/{name}/HEAD/eh3d.project.json")
              if raw is None or me not in (json.loads(raw).get("depends_on") or []):
                  continue
              if get(f"https://raw.githubusercontent.com/{owner}/{name}/HEAD/Cargo.toml") is not None:
                  found.append(name)
          print("Consumers:", found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("repos=" + json.dumps(found) + "\n")
          PY

  consumers:
    name: Consumer ${{ matrix.repo }}
    # Builds every repository that depends on this one, with this change in place of the sibling, so a break reaches the author before the merge.
    needs: consumers-list
    if: needs.consumers-list.outputs.repos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.consumers-list.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-COMMON
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check out the consumer and its other siblings at main
        shell: bash
        env:
          CONSUMER: ${{ matrix.repo }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, me = os.environ["GITHUB_REPOSITORY"].split("/")
          consumer = os.environ["CONSUMER"]
          pending, seen = [consumer], {me, consumer}
          subprocess.run(["git", "clone", "--quiet", "--depth", "1", f"https://github.com/{owner}/{consumer}.git", consumer], check=True)
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  subprocess.run(["git", "clone", "--quiet", "--depth", "1", f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  pending.append(dep)
          PY
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-COMMON
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Build the consumer against this change
        run: cargo check --all-targets
        working-directory: ${{ matrix.repo }}
