[package]
name = "eh3d-archive"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
description = "Jobs packed in ZIP archives: the drilling and the routing files inside, opened with care (unsafe names left out, sizes limited)"
license = "GPL-3.0-or-later"
authors = ["JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>"]
repository = "https://github.com/JuanenRac/EH3D-COMMON"

[dependencies]
# the container of the suite is a standard ZIP archive (deflate only)
zip = { version = "2", default-features = false, features = ["deflate"] }
