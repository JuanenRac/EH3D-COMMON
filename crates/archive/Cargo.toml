[package]
name = "eh3d-archive"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Jobs packed in ZIP archives: the drilling and the routing files inside, opened with care (unsafe names left out, sizes limited)"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# the container of the suite is a standard ZIP archive (deflate only)
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# flate2: the pure Rust deflate backend that the zip crate leaves open; it keeps the written bytes the same as before.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
