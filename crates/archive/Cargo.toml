[package]
name = "eh3d-archive"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Jobs packed in ZIP archives: the drilling and the routing files inside, opened with care (unsafe names left out, sizes limited)"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# the container of the suite is a standard ZIP archive (deflate only)
zip = { version = "2", default-features = false, features = ["deflate"] }
