[package]
name = "eh3d-project"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The .eh3d project container of the suite: one file with a branch for each program, integrity for every branch, references between branches that notice when a derived branch is out of date, optional metadata and documentation, and the points where signing, encryption, sealing and an audit log plug in"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "eh3d-project"
path = "src/main.rs"

[dependencies]
# ed25519-dalek: the signature of branches and projects, pure Rust (no C compiler). The version is
# fixed; "zeroize" wipes the secret key from memory, nothing else is switched on.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
# getrandom: the random source of the system, for new keys and project identifiers.
getrandom = "0.4"
thiserror = "2"
zeroize = "1"
# argon2 (Argon2id): the key that a password gives, for a signature key file with a password. chacha20poly1305
# (XChaCha20-Poly1305): the authenticated encryption of that file. rpassword: the password asked at a terminal
# without showing it. All pure Rust, versions fixed.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
rpassword = "=7.5.5"
eh3d-container = { version = ">=0.0.1", path = "../container" }
eh3d-diagnostic = { version = ">=0.0.1", path = "../diagnostic" }
# what a file is and whether it is dangerous, the one classification of the suite
eh3d-filekind = { version = ">=0.0.1", path = "../filekind" }
serde = { version = "1", features = ["derive"] }
# sha2: the hash of an attachment is worked out while it is read in blocks (the version of the suite).
sha2 = "0.10"
# float_roundtrip: the same switch as the container, which writes canonical JSON.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
# the tests compare the compressed bytes of an entry before and after another branch was saved
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
