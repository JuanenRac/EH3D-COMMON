[package]
name = "eh3d-inspect"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The check of the work from a picture of the camera of the drill head: are the holes there, round, the right size and in place, are the milled channels as wide as the tool and even, and was the picture good enough to say so"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde_json = "1"
# the pictures of the camera are JPEG; only the decoder is needed, without threads
jpeg-decoder = { version = "0.3", default-features = false }

[lints]
workspace = true
