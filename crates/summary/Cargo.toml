[package]
name = "eh3d-summary"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "What a person is shown before a job starts on a machine that moves: the dry run of the exact plan against the course of the axes, the sanity checks of the work and the summary in the languages of the suite"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# the machine file: the table and the scale of the machine the work is checked against
eh3d-bungard-formats = { version = ">=0.0.1", path = "../formats" }
# the words of the summary in the 37 languages of the suite
eh3d-view = { version = ">=0.0.1", path = "../view" }
