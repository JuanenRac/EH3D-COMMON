# The limits of the readers of the drill file, the plot, the drawing and the Gerber outline.
# A file past a hard limit is refused with a stated reason; a file past a warning limit is read and warned about.
# One `key = value` per line; a line that starts with `#` is a comment. A program may carry its own copy of this file.
max_bytes = 67108864
max_lines = 4000000
warn_bytes = 16777216
warn_lines = 1000000
