[package]
name = "eh3d-diagnostic"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
description = "The common diagnostic of the suite: a stable code, a severity, a message and where it happened, with a stable JSON form and a redacted form"
license = "GPL-3.0-or-later"
authors = ["JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>"]
repository = "https://github.com/JuanenRac/EH3D-COMMON"

[features]
default = ["serde"]
# the JSON form (the only dependency of the crate)
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
