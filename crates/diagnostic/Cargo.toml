[package]
name = "eh3d-diagnostic"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The common diagnostic of the suite: a stable code, a severity, a message and where it happened, with a stable JSON form and a redacted form"
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["serde"]
# the JSON form (the only dependency of the crate)
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
