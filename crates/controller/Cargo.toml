[package]
name = "eh3d-controller"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The interface every machine controller of the EH3D suite speaks (Bungard, HYDRA-UMC, GRBL and the rest), and the first controllers written against it"
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# a real serial port for the controllers that talk lines of text
serial = ["dep:serialport"]

[dependencies]
serialport = { version = "4", default-features = false, optional = true }

[lints]
workspace = true
