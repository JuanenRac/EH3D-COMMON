[package]
name = "eh3d-viewer"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The viewer of the attachments of a project for the EH3D programs: what a file is, whether it is dangerous, PDF pages with PDFium, the text of office documents, pictures and Markdown, and opening outside with care"
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# the panel drawn with egui (the model it draws has no window and is always there)
gui = ["dep:egui"]

[dependencies]
# what a file is and whether it is dangerous, the one classification of the suite
eh3d-filekind = { version = ">=0.0.1", path = "../filekind" }
# the languages of the interface are the ones of eh3d-view
eh3d-view = { version = ">=0.0.1", path = "../view" }
# the office documents of today are ZIP archives of XML files
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# the pictures shown inside the program, decoded in Rust with limits
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# the PDF engine is a library loaded when the program runs, from its own folder only
libloading = "0.8"
# its SHA-256 and the pins of every platform (pdfium.json)
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the window, only with the feature `gui`
egui = { version = "0.37.0", default-features = false, optional = true }

[lints]
workspace = true
